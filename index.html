eader: true, colWidths: [1700, 2900, 5840] });\n    body += p('', { spacingAfter: 120 });\n    const synthBlocks = activeIds.map(cid => {\n      const comp = COMPOSANTES.find(c => c.id === cid);\n      const txt = this.synthOf(cid, perComposanteCompute[cid]);\n      return txt ? { comp, txt, lab: this.palierLabelOf(perComposanteCompute[cid], PALIERS) } : null;\n    }).filter(Boolean);\n    if (synthBlocks.length) {\n      body += heading('Synthèse du palier actuel (TPALF)');\n      synthBlocks.forEach(b => {\n        body += p(b.comp.label + ' — ' + b.lab, { bold: true, size: 10.5, spacingAfter: 40 });\n        body += p(b.txt, { size: 10.5, spacingAfter: 120 });\n      });\n    }\n    body += p('', { spacingAfter: 160 });\n\n    body += heading('Attentes ciblées');\n    const periodRows = [['Dates', 'Descripteurs ciblés', \"Commentaires / preuves d'apprentissage\"]];\n    if (s.periodes.length) {\n      s.periodes.forEach(per => {\n        const comp = COMPOSANTES.find(c => c.id === per.composanteId);\n        const items = this.bankFor(per.composanteId, s.anneeTpalf).filter(i => s.periodeItemSel[`${per.id}|${i.id}`]);\n        periodRows.push([\n          { xml: p(per.dates || '—', { bold: true, size: 10.5, spacingAfter: 0 }) },\n          { xml: (comp ? p(comp.label, { bold: true, size: 10.5, spacingAfter: 40 }) : '') + bulletList(items.map(i => i.text)) },\n          { xml: p(per.commentaires || '—', { size: 10.5, spacingAfter: 0 }) },\n        ]);\n      });\n    } else {\n      // Aucune période saisie manuellement : on génère les attentes par défaut à\n      // partir du prochain palier du continuum pour chaque composante active, afin\n      // que cette section ne reste jamais vide.\n      activeIds.forEach(cid => {\n        const comp = COMPOSANTES.find(c => c.id === cid);\n        const attentes = this.attentesFor(cid);\n        if (!attentes.length) return;\n        const computed = perComposanteCompute[cid];\n        const nextId = this.nextPalierId(computed);\n        const targetLabel = nextId !== null ? this.palierLabelOf(nextId, PALIERS) : this.palierLabelOf(computed, PALIERS);\n        periodRows.push([\n          { xml: p('À déterminer', { bold: true, size: 10.5, spacingAfter: 0 }) },\n          { xml: p(`${comp.label} — vers le ${targetLabel}`, { bold: true, size: 10.5, spacingAfter: 40 }) + bulletList(attentes.map(i => i.text)) },\n          { xml: p('—', { size: 10.5, spacingAfter: 0 }) },\n        ]);\n      });\n    }\n    if (periodRows.length > 1) body += table(periodRows, { header: true, colWidths: [1700, 4870, 3870] }); else body += p('—', { size: 11 });\n    body += p('', { spacingAfter: 160 });\n\n    body += heading('Communication du rendement');\n    body += p('Présentation du plan — Bulletin de progrès : ' + (s.bulletins.map(b => b.label).join(', ') || '—'), { size: 11, spacingAfter: 100 });\n    body += p('Résumé de la rencontre :', { bold: true, size: 11, spacingAfter: 40 });\n    body += p(s.resume || '—', { size: 11, spacingAfter: 140 });\n    body += table([\n      ['Nom et prénom du parent ou tuteur', s.parentNom || '—'],\n      ['Signature du parent', '—'],\n      ['Date', this.fmtDate(s.parentDate) || '—'],\n    ], { colWidths: [3300, 7140] });\n\n    const studentLine = `${s.student.nom || 'Élève'}${s.student.annee ? ' — ' + s.student.annee : ''}${s.student.dateRevision ? ' — rév. ' + this.fmtDate(s.student.dateRevision) : ''}`;\n    const headerCells = [\n      logoBytes ? { xml: imageRun('rIdLogo', 46, 46), shade: 'FFFFFF' } : { xml: p('', { spacingAfter: 0 }), shade: 'FFFFFF' },\n      { xml: p(\"Plan d'appui temporaire — Francisation\", { bold: true, size: 12, color: '2E5C88', spacingAfter: 10 }) + p(studentLine, { size: 9.5, color: '6B7685', spacingAfter: 0 }), shade: 'FFFFFF' },\n    ];\n    const headerXml = table([headerCells], { colWidths: [900, 9540], borders: false, zebra: false }) +\n      `<w:p><w:pPr><w:pBdr><w:bottom w:val=\"single\" w:sz=\"6\" w:color=\"2E5C88\"/><\u002Fw:pBdr><w:spacing w:after=\"0\"/><\u002Fw:pPr><\u002Fw:p>`;\n    const footerXml = footerPageNumberXml();\n\n    const blob = buildDocxBlob(body, { headerXml, footerXml, logoBytes });\n    const fname = (s.student.nom || 'eleve').replace(/[^a-z0-9\\-_ ]/gi, '').trim().replace(/\\s+/g, '_') || 'eleve';\n    downloadBlob(blob, `PAT_${fname}.docx`);\n  }\n\n  renderVals() {\n    if (!this.data) return { student: this.state.student, generating: false, generateLabel: '⬇ Télécharger', generateLabelLong: '⬇ Télécharger le PAT (.docx)', composantesList: [], composantesTabsDiag: [], activeComposante: { palierGroups: [], hasData: false, noData: true, importGroups: [], label: '', pdfLink: '#' }, periodes: [], bulletins: this.state.bulletins, anneesOptions: [], palierInfo: { label: '', explanation: '' }, showPalierInfo: false, steps: [] };\n    const { COMPOSANTES, PALIERS, ANNEES } = this.data;\n    const s = this.state;\n    const stepIdx = STEPS.findIndex(st => st.id === s.step);\n\n    const steps = STEPS.map((st, i) => {\n      const active = st.id === s.step;\n      const done = i < stepIdx;\n      return {\n        id: st.id, label: st.label, num: i + 1,\n        doneMark: done ? '✓' : '',\n        border: active ? 'oklch(0.5 0.1 220)' : 'oklch(0.9 0.01 260)',\n        bg: active ? 'oklch(0.96 0.03 220)' : 'white',\n        numColor: active ? 'oklch(0.5 0.1 220)' : 'oklch(0.6 0.02 260)',\n        textColor: active ? 'oklch(0.35 0.06 220)' : 'oklch(0.4 0.02 260)',\n        onClick: () => this.goStep(st.id),\n      };\n    });\n\n    const composantesList = COMPOSANTES.map(c => ({\n      id: c.id, label: c.label, active: !!s.activeComposantes[c.id],\n      border: s.activeComposantes[c.id] ? 'oklch(0.5 0.1 220)' : 'oklch(0.85 0.01 260)',\n      tabBg: s.activeComposantes[c.id] ? 'oklch(0.96 0.03 220)' : 'white',\n      tabColor: s.activeComposantes[c.id] ? 'oklch(0.35 0.06 220)' : 'oklch(0.4 0.02 260)',\n      onToggleActive: () => this.toggleComposanteActive(c.id),\n    }));\n\n    const activeCompList = COMPOSANTES.filter(c => s.activeComposantes[c.id]);\n    const composantesTabsDiag = activeCompList.map(c => {\n      const defisCount = this.defisFor(c.id).length;\n      return {\n        id: c.id, label: c.label,\n        tabBg: s.tab === c.id ? 'oklch(0.5 0.1 220)' : 'white',\n        tabColor: s.tab === c.id ? 'white' : 'oklch(0.35 0.02 260)',\n        onSelectTab: () => this.selectTab(c.id),\n        hasDefis: defisCount > 0, defisCount,\n        badgeBg: s.tab === c.id ? 'white' : 'oklch(0.65 0.15 55)',\n        badgeColor: s.tab === c.id ? 'oklch(0.5 0.1 220)' : 'white',\n      };\n    });\n\n    const quickSummary = activeCompList.map(c => {\n      const items = this.bankFor(c.id, s.anneeTpalf);\n      const { computed } = this.computePalier(items);\n      const defisCount = this.defisFor(c.id).length;\n      return { id: c.id, label: c.label, palier: this.palierLabelOf(computed, PALIERS), hasDefis: defisCount > 0, defisCount };\n    });\n\n    const compDef = COMPOSANTES.find(c => c.id === s.tab) || COMPOSANTES[0];\n    const bankItems = this.bankFor(compDef.id, s.anneeTpalf);\n    const hasData = bankItems.length > 0;\n    const { computed, ratios } = this.computePalier(bankItems);\n\n    const palierGroups = PALIERS.map((pl, idx) => {\n      const cats = pl.id === 'eveil' ? ['Descripteurs'] : compDef.categories;\n      const r = ratios[pl.id];\n      const pct = r ? Math.round(r.ratio * 100) : 0;\n      return {\n        palierId: pl.id,\n        palierLabel: pl.id === 'eveil' ? compDef.eveilLabel : pl.label,\n        palierSub: pl.sub,\n        open: idx < 2,\n        pct, barColor: pct >= 50 ? 'oklch(0.6 0.15 155)' : 'oklch(0.65 0.14 55)',\n        ratioLabel: r ? `${r.forced}/${r.total}` : '—',\n        onMarkAll: () => this.markAllInPalier(compDef.id, pl.id, true),\n        onClearAll: () => this.markAllInPalier(compDef.id, pl.id, false),\n        categories: cats.map(category => {\n          const items = bankItems.filter(b => String(b.palierId) === String(pl.id) && b.category === category)\n            .map(it => ({\n              id: it.id, text: it.text,\n              force: !!s.sel[it.id]?.force,\n              textColor: s.sel[it.id]?.force ? 'oklch(0.4 0.1 155)' : 'inherit',\n              onToggleForce: () => this.toggleForce(it.id),\n            }));\n          return { category, items };\n        }),\n      };\n    });\n\n    const importGroups = PALIERS.map(pl => {\n      const cats = pl.id === 'eveil' ? ['Descripteurs'] : compDef.categories;\n      return {\n        palierLabel: pl.id === 'eveil' ? compDef.eveilLabel : pl.label,\n        categories: cats.map(category => {\n          const key = this.addValueKey(s.anneeTpalf, s.tab, pl.id, category);\n          return {\n            category,\n            addValue: s.addValues[key] || '',\n            onAddValueChange: (e) => this.handleAddValueChange(key, e.target.value),\n            onAdd: () => this.addDescriptors(pl.id, category),\n          };\n        }),\n      };\n    });\n\n    const activeComposante = {\n      id: compDef.id, label: compDef.label,\n      pdfLink: compDef.pdf[s.anneeTpalf] || Object.values(compDef.pdf)[0] || '#',\n      palierGroups, hasData, noData: !hasData, importGroups,\n    };\n\n    const palierLabelText = this.palierLabelOf(computed, PALIERS);\n    const explLines = PALIER_ORDER.map(pid => {\n      const r = ratios[pid];\n      const label = this.palierLabelOf(pid, PALIERS);\n      if (!r) return `${label} : aucun descripteur chargé encore.`;\n      const status = r.ratio >= 0.8 ? 'atteint' : 'non atteint';\n      return `${label} : ${r.forced}/${r.total} réussis (${Math.round(r.ratio * 100)}%) — ${status} (seuil 80%).`;\n    });\n    const palierInfo = { label: palierLabelText, explanation: `Palier estimé pour ${compDef.label} : ${palierLabelText}.\\n\\n` + explLines.join('\\n') };\n\n    const activeIds = activeCompList.map(c => c.id);\n    const prioriteComposantes = [];\n    const catSet = new Set();\n    const prioriteDetails = [];\n    activeIds.forEach(cid => {\n      const comp = COMPOSANTES.find(c => c.id === cid);\n      const defis = this.defisFor(cid);\n      if (defis.length) {\n        prioriteComposantes.push({ label: comp.label });\n        const items = this.bankFor(cid, s.anneeTpalf);\n        const { computed: cComputed } = this.computePalier(items);\n        const curLabel = this.palierLabelOf(cComputed, PALIERS);\n        const curIdx = PALIER_ORDER.findIndex(p => String(p) === String(cComputed));\n        const nextId = PALIER_ORDER[Math.min(curIdx + 1, PALIER_ORDER.length - 1)];\n        const nextLabel = this.palierLabelOf(nextId, PALIERS);\n        const catsHere = Array.from(new Set(defis.map(i => i.category)));\n        catsHere.forEach(c => catSet.add(c));\n        prioriteDetails.push({\n          id: cid, label: comp.label, curLabel, nextLabel,\n          curSynth: this.synthOf(cid, cComputed), nextSynth: this.synthOf(cid, nextId),\n          hasSynth: !!(this.synthOf(cid, cComputed) || this.synthOf(cid, nextId)),\n          categories: catsHere.map(cat => {\n            const info = this.strategiesModule.getStrategyInfo(cat, s.anneeTpalf, cid);\n            return { category: cat === 'Descripteurs' ? 'Éveil' : cat, objectif: info.objectif,\n              strategies: info.strategies.map((text, idx) => {\n                const key = this.stratKey(cid, cat, idx);\n                return { text, checked: this.isStratOn(key, idx), onToggle: () => this.toggleStrat(key, idx) };\n              }),\n              defis: defis.filter(i => i.category === cat).map(i => i.text) };\n          }),\n        });\n      }\n    });\n    const composantesACibler = Array.from(catSet).map(label => ({ label }));\n\n    const composanteOptions = activeIds.map(id => ({ id, label: COMPOSANTES.find(c => c.id === id).label }));\n    const periodes = s.periodes.map(per => {\n      const defis = this.attentesFor(per.composanteId).map(it => ({\n        id: it.id, text: it.text,\n        checked: !!s.periodeItemSel[`${per.id}|${it.id}`],\n        onToggle: () => this.togglePeriodeItem(per.id, it.id),\n      }));\n      return {\n        id: per.id, dates: per.dates, composanteId: per.composanteId, composanteOptions,\n        onDatesChange: (e) => this.updatePeriode(per.id, 'dates', e.target.value),\n        onComposanteChange: (e) => this.updatePeriode(per.id, 'composanteId', e.target.value),\n        onRemove: () => this.removePeriode(per.id),\n        availableItems: defis, hasItems: defis.length > 0, hasNoItems: defis.length === 0,\n        commentaires: per.commentaires, onCommentairesChange: (e) => this.updatePeriode(per.id, 'commentaires', e.target.value),\n      };\n    });\n\n    const bulletins = s.bulletins.map(b => ({ id: b.id, label: b.label, onLabelChange: (e) => this.updateBulletin(b.id, e.target.value), onRemove: () => this.removeBulletin(b.id) }));\n\n    const doGenerate = () => {\n      this.setState({ generating: true });\n      this.generateDocx().finally(() => this.setState({ generating: false }));\n    };\n\n    return {\n      steps, isStepEleve: s.step === 'eleve', isStepDiagnostic: s.step === 'diagnostic', isStepPriorites: s.step === 'priorites', isStepCommunication: s.step === 'communication',\n      hasPrevStep: stepIdx > 0, hasNoPrevStep: stepIdx === 0, hasNextStep: stepIdx < STEPS.length - 1,\n      onPrevStep: () => this.prevStep(), onNextStep: () => this.nextStep(),\n      showQuickSummary: s.step === 'diagnostic' || s.step === 'priorites', quickSummary,\n      student: s.student, onStudentChange: this.handleStudentChange,\n      onExportProfil: this.exportProfil, onImportProfil: this.importProfil, onNouveauProfil: this.nouveauProfil,\n      profilMsg: this.state.profilMsg || '', hasProfilMsg: !!this.state.profilMsg,\n      headerSuffix: (this.state.student && this.state.student.nom) ? ' — ' + this.state.student.nom : '',\n      anneesScolaires: ANNEES_SCOLAIRES, paysListe: PAYS, languesListe: LANGUES,\n      anneeTpalf: s.anneeTpalf, onAnneeTpalfChange: this.handleAnneeTpalfChange, anneesOptions: ANNEES,\n      composantesList, composantesTabsDiag, activeComposante,\n      hasActiveComposantes: activeCompList.length > 0, hasNoActiveComposantes: activeCompList.length === 0,\n      showPalierInfo: s.showPalierInfo, onTogglePalierInfo: () => this.togglePalierInfo(), palierInfo,\n      prioriteComposantes, hasPriorite: prioriteComposantes.length > 0, hasNoPriorite: prioriteComposantes.length === 0,\n      composantesACibler, hasCategories: composantesACibler.length > 0, hasNoCategories: composantesACibler.length === 0,\n      prioriteDetails, hasPrioriteDetails: prioriteDetails.length > 0,\n      periodes, hasNoPeriodes: periodes.length === 0, onAddPeriode: () => this.addPeriode(),\n      bulletins, onAddBulletin: () => this.addBulletin(),\n      resume: s.resume, onResumeChange: (e) => this.persist({ resume: e.target.value }),\n      parentNom: s.parentNom, onParentNomChange: (e) => this.persist({ parentNom: e.target.value }),\n      parentDate: s.parentDate, onParentDateChange: (e) => this.persist({ parentDate: e.target.value }),\n      generating: !!s.generating,\n      generateLabel: s.generating ? '⏳ Génération…' : '⬇ Télécharger',\n      generateLabelLong: s.generating ? '⏳ Génération en cours…' : '⬇ Télécharger le PAT (.docx)',\n      onGenerate: doGenerate, onQuickGenerate: doGenerate,\n      onReset: () => this.reset(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
