document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

portant; transform: none; }\n<\u002Fstyle>\n<script type=\"text/javascript\" src=\"331a02d8-21d2-4a80-86e9-5b06d5dbdfac\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Nunito',sans-serif;color:oklch(0.25 0.02 260);max-width:1080px;margin:0 auto;padding:20px 24px 90px;\">\n\n  <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;\">\n    <div style=\"width:68px;height:68px;flex:none;\">\n      <x-import component-from-global-scope=\"image-slot\" from=\"331a02d8-21d2-4a80-86e9-5b06d5dbdfac#/image-slot.js\" id=\"logo-ecole\" shape=\"rounded\" radius=\"12\" placeholder=\"Logo\" style=\"width:68px;height:68px\" hint-size=\"68px,68px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"flex:1;\">\n      <h1 style=\"margin:0;font-size:22px;font-weight:800;color:oklch(0.4 0.08 220);\">Plan d'appui temporaire<\u002Fh1>\n      <p style=\"margin:2px 0 0;font-size:13px;color:oklch(0.5 0.02 260);\">D'après les continuums langagiers du <a href=\"https://tpalf.ca\" target=\"_blank\" rel=\"noopener\">TPALF<\u002Fa>{{ headerSuffix }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;\">\n    <button sc-camel-on-click=\"{{ onNouveauProfil }}\" style=\"border:1px solid oklch(0.88 0.01 260);background:white;color:oklch(0.4 0.02 260);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;\" style-hover=\"background:oklch(0.97 0.01 260);\">Nouveau<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onImportProfil }}\" style=\"border:1px solid oklch(0.88 0.01 260);background:white;color:oklch(0.4 0.02 260);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;\" style-hover=\"background:oklch(0.97 0.01 260);\">Ouvrir un profil<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onExportProfil }}\" style=\"border:1px solid oklch(0.88 0.01 260);background:white;color:oklch(0.4 0.02 260);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;\" style-hover=\"background:oklch(0.97 0.01 260);\">Enregistrer le profil<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onQuickGenerate }}\" disabled=\"{{ generating }}\" style=\"border:1px solid oklch(0.5 0.1 220);background:white;color:oklch(0.45 0.1 220);border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;\" style-hover=\"background:oklch(0.96 0.03 220);\">{{ generateLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ hasProfilMsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:oklch(0.95 0.05 150);color:oklch(0.35 0.08 150);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;margin-bottom:12px;\">{{ profilMsg }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;gap:6px;margin-bottom:16px;\">\n    <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ st.onClick }}\" style=\"flex:1;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid {{ st.border }};background:{{ st.bg }};cursor:pointer;font-family:'Nunito',sans-serif;transition:background .12s ease,border-color .12s ease;\" style-hover=\"border-color:oklch(0.6 0.1 220);\">\n        <div style=\"font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:{{ st.numColor }};\">Étape {{ st.num }} {{ st.doneMark }}<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:{{ st.textColor }};margin-top:2px;\">{{ st.label }}<\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showQuickSummary }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;\">\n      <sc-for list=\"{{ quickSummary }}\" as=\"qs\" hint-placeholder-count=\"3\">\n        <div style=\"background:white;border:1px solid oklch(0.9 0.01 260);border-radius:10px;padding:7px 12px;font-size:12.5px;display:flex;gap:6px;align-items:center;\">\n          <span style=\"font-weight:700;color:oklch(0.4 0.08 220);\">{{ qs.label }}<\u002Fspan>\n          <span style=\"color:oklch(0.5 0.02 260);\">{{ qs.palier }}<\u002Fspan>\n          <sc-if value=\"{{ qs.hasDefis }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"background:oklch(0.65 0.15 55);color:white;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:800;\">{{ qs.defisCount }} à cibler<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStepEleve }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"background:white;border-radius:18px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px oklch(0 0 0 / 0.06);\">\n    <h2 style=\"margin:0 0 4px;font-size:16px;font-weight:700;color:oklch(0.4 0.08 220);\">Renseignements sur l'élève<\u002Fh2>\n    <p style=\"margin:0 0 16px;font-size:13px;color:oklch(0.5 0.02 260);\">Ces informations apparaissent dans l'en-tête du document généré.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Nom et prénom\n        <input name=\"nom\" value=\"{{ student.nom }}\" sc-camel-on-change=\"{{ onStudentChange }}\" placeholder=\"Nom de l'élève\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Année d'étude (bulletin)\n        <sc-raw-select name=\"annee\" value=\"{{ student.annee }}\" sc-camel-on-change=\"{{ onStudentChange }}\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;background:white;\">\n          <option value=\"\">Choisir l'année<\u002Foption>\n          <sc-for list=\"{{ anneesScolaires }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Date de la dernière révision\n        <input type=\"date\" name=\"dateRevision\" value=\"{{ student.dateRevision }}\" sc-camel-on-change=\"{{ onStudentChange }}\" style=\"padding:8px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;font-family:inherit;\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Pays d'origine\n        <sc-raw-select name=\"paysOrigine\" value=\"{{ student.paysOrigine }}\" sc-camel-on-change=\"{{ onStudentChange }}\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;background:white;\">\n          <option value=\"\">Choisir le pays<\u002Foption>\n          <sc-for list=\"{{ paysListe }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Langue première / dominante\n        <sc-raw-select name=\"langueDominante\" value=\"{{ student.langueDominante }}\" sc-camel-on-change=\"{{ onStudentChange }}\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;background:white;\">\n          <option value=\"\">Choisir la langue<\u002Foption>\n          <sc-for list=\"{{ languesListe }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Année du TPALF (continuum à utiliser)\n        <sc-raw-select name=\"anneeTpalf\" value=\"{{ anneeTpalf }}\" sc-camel-on-change=\"{{ onAnneeTpalfChange }}\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;\">\n          <sc-for list=\"{{ anneesOptions }}\" as=\"ao\" hint-placeholder-count=\"4\">\n            <option value=\"{{ ao.id }}\">{{ ao.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px;\">\n      <div style=\"font-size:13px;font-weight:700;color:oklch(0.45 0.02 260);margin-bottom:8px;\">Composantes actives pour ce PAT<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ composantesList }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <label style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid {{ c.border }};background:{{ c.tabBg }};cursor:pointer;\">\n            <input type=\"checkbox\" checked=\"{{ c.active }}\" sc-camel-on-change=\"{{ c.onToggleActive }}\" style=\"width:14px;height:14px;margin:0;\">\n            <span style=\"font-size:13px;font-weight:700;color:{{ c.tabColor }};\">{{ c.label }}<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStepDiagnostic }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"background:white;border-radius:18px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px oklch(0 0 0 / 0.06);\">\n    <div style=\"background:oklch(0.96 0.03 220);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;line-height:1.5;color:oklch(0.35 0.06 220);\">\n      <strong>Comment faire :<\u002Fstrong> choisis une composante, puis coche uniquement ce que l'élève réussit déjà (✓ Réussi). Tout le reste devient automatiquement un défi à cibler, et le palier se calcule pour toi.\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;\">\n      <sc-for list=\"{{ composantesTabsDiag }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ c.onSelectTab }}\" style=\"padding:9px 16px;border-radius:999px;border:1px solid oklch(0.85 0.01 260);cursor:pointer;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;background:{{ c.tabBg }};color:{{ c.tabColor }};display:inline-flex;align-items:center;gap:8px;white-space:nowrap;\">\n          <span>{{ c.label }}<\u002Fspan>\n          <sc-if value=\"{{ c.hasDefis }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"background:{{ c.badgeBg }};color:{{ c.badgeColor }};border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:800;\">{{ c.defisCount }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasActiveComposantes }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;\">\n      <div style=\"background:oklch(0.94 0.03 220);border-radius:12px;padding:8px 14px;font-size:13.5px;font-weight:700;color:oklch(0.4 0.08 220);\">\n        Palier estimé : {{ palierInfo.label }}\n        <button sc-camel-on-click=\"{{ onTogglePalierInfo }}\" style=\"border:none;background:oklch(0.5 0.1 220);color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:800;cursor:pointer;margin-left:6px;\">?<\u002Fbutton>\n      <\u002Fdiv>\n      <a href=\"{{ activeComposante.pdfLink }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;\">📄 Continuum officiel ({{ activeComposante.label }}) — tpalf.ca<\u002Fa>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showPalierInfo }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:oklch(0.97 0.02 90);border:1px solid oklch(0.88 0.03 90);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6;white-space:pre-line;\">{{ palierInfo.explanation }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ activeComposante.hasData }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-for list=\"{{ activeComposante.palierGroups }}\" as=\"pg\" hint-placeholder-count=\"5\">\n        <details open=\"{{ pg.open }}\" style=\"border:1px solid oklch(0.9 0.01 260);border-radius:14px;padding:10px 16px;margin-bottom:12px;\">\n          <summary style=\"display:flex;align-items:center;gap:10px;list-style:none;flex-wrap:wrap;\">\n            <span style=\"font-weight:800;font-size:14px;color:oklch(0.4 0.08 220);\">{{ pg.palierLabel }}<\u002Fspan>\n            <span style=\"font-size:12px;color:oklch(0.55 0.02 260);\">{{ pg.palierSub }}<\u002Fspan>\n            <div style=\"flex:1;min-width:80px;height:6px;background:oklch(0.92 0.01 260);border-radius:999px;overflow:hidden;max-width:160px;\">\n              <div style=\"height:100%;width:{{ pg.pct }}%;background:{{ pg.barColor }};\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;color:{{ pg.barColor }};font-weight:700;\">{{ pg.ratioLabel }}<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"margin-top:10px;\">\n          <div style=\"display:flex;gap:8px;margin-bottom:10px;\">\n            <button sc-camel-on-click=\"{{ pg.onMarkAll }}\" style=\"border:1px solid oklch(0.7 0.14 155);background:oklch(0.96 0.04 155);color:oklch(0.35 0.12 155);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;\">✓ Tout réussi<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ pg.onClearAll }}\" style=\"border:1px solid oklch(0.85 0.01 260);background:white;color:oklch(0.45 0.02 260);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;\">Tout décocher<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-for list=\"{{ pg.categories }}\" as=\"cat\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:12px;padding-left:2px;\">\n              <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:oklch(0.55 0.02 260);margin-bottom:6px;\">{{ cat.category }}<\u002Fdiv>\n              <sc-for list=\"{{ cat.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                <label style=\"display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid oklch(0.95 0 0);cursor:pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ it.force }}\" sc-camel-on-change=\"{{ it.onToggleForce }}\" style=\"margin-top:3px;\">\n                  <span style=\"flex:1;font-size:13.5px;line-height:1.4;color:{{ it.textColor }};\">{{ it.text }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ activeComposante.noData }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:oklch(0.97 0.02 90);border:1px dashed oklch(0.8 0.02 90);border-radius:12px;padding:16px;margin-bottom:10px;\">\n        <p style=\"margin:0 0 10px;font-size:13.5px;\">Aucun descripteur chargé pour <strong>{{ activeComposante.label }}<\u002Fstrong> à cette année d'étude. Colle les descripteurs depuis le <a href=\"{{ activeComposante.pdfLink }}\" target=\"_blank\" rel=\"noopener\">PDF officiel<\u002Fa> ci-dessous (un descripteur par ligne), par palier et catégorie.<\u002Fp>\n        <sc-for list=\"{{ activeComposante.importGroups }}\" as=\"ig\" hint-placeholder-count=\"5\">\n          <div style=\"border-top:1px solid oklch(0.92 0.01 260);padding-top:10px;margin-top:10px;\">\n            <div style=\"font-weight:700;font-size:13px;margin-bottom:6px;\">{{ ig.palierLabel }}<\u002Fdiv>\n            <sc-for list=\"{{ ig.categories }}\" as=\"icat\" hint-placeholder-count=\"3\">\n              <div style=\"margin-bottom:8px;\">\n                <div style=\"font-size:12px;color:oklch(0.5 0.02 260);margin-bottom:4px;\">{{ icat.category }}<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;\">\n                  <textarea value=\"{{ icat.addValue }}\" sc-camel-on-change=\"{{ icat.onAddValueChange }}\" placeholder=\"Un descripteur par ligne…\" rows=\"2\" style=\"flex:1;padding:8px 10px;border-radius:10px;border:1px solid oklch(0.9 0.01 260);font-size:13px;resize:vertical;\"><\u002Ftextarea>\n                  <button sc-camel-on-click=\"{{ icat.onAdd }}\" style=\"border:none;background:oklch(0.5 0.1 220);color:white;border-radius:10px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;\">Ajouter<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasNoActiveComposantes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:30px;color:oklch(0.55 0.02 260);font-size:13.5px;\">Aucune composante active. Retourne à l'étape 1 pour en choisir au moins une.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStepPriorites }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"background:white;border-radius:18px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px oklch(0 0 0 / 0.06);\">\n    <h2 style=\"margin:0 0 4px;font-size:16px;font-weight:700;color:oklch(0.4 0.08 220);\">Priorité et pistes d'intervention<\u002Fh2>\n    <p style=\"margin:0 0 14px;font-size:13px;color:oklch(0.5 0.02 260);\">Calculé automatiquement à partir des défis au palier estimé (seuil de maîtrise 80 %). Stratégies suggérées à adapter selon le contexte de la classe.<\u002Fp>\n    <sc-if value=\"{{ hasPrioriteDetails }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-for list=\"{{ prioriteDetails }}\" as=\"pd\" hint-placeholder-count=\"2\">\n        <div style=\"border:1px solid oklch(0.9 0.01 260);border-radius:14px;padding:14px 16px;margin-bottom:12px;\">\n          <div style=\"font-size:14px;font-weight:800;color:oklch(0.4 0.08 220);margin-bottom:4px;\">{{ pd.label }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(0.5 0.02 260);margin-bottom:10px;\">Actuellement au <strong>{{ pd.curLabel }}<\u002Fstrong> — concentrer l'appui sur les catégories ci-dessous pour viser le <strong>{{ pd.nextLabel }}<\u002Fstrong>.<\u002Fdiv>\n          <sc-if value=\"{{ pd.hasSynth }}\" hint-placeholder-val=\"{{ false }}\">\n            <details style=\"margin-bottom:10px;font-size:12.5px;line-height:1.55;color:oklch(0.35 0.02 260);\">\n              <summary style=\"cursor:pointer;font-weight:700;color:oklch(0.45 0.08 220);\">Synthèse des paliers (TPALF)<\u002Fsummary>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px;\">\n                <div style=\"background:oklch(0.97 0.01 260);border-radius:10px;padding:10px 12px;\"><div style=\"font-weight:700;margin-bottom:4px;\">{{ pd.curLabel }} (actuel)<\u002Fdiv>{{ pd.curSynth }}<\u002Fdiv>\n                <div style=\"background:oklch(0.96 0.03 220);border-radius:10px;padding:10px 12px;\"><div style=\"font-weight:700;margin-bottom:4px;\">{{ pd.nextLabel }} (visé)<\u002Fdiv>{{ pd.nextSynth }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ pd.categories }}\" as=\"cat\" hint-placeholder-count=\"2\">\n            <div style=\"background:oklch(0.97 0.015 90);border-radius:10px;padding:10px 12px;margin-bottom:8px;\">\n              <div style=\"font-size:12.5px;font-weight:700;color:oklch(0.35 0.02 260);margin-bottom:2px;\">{{ cat.category }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:oklch(0.45 0.02 260);margin-bottom:6px;\">{{ cat.objectif }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(0.55 0.12 55);margin:6px 0 2px;\">Descripteurs à cibler<\u002Fdiv>\n              <sc-for list=\"{{ cat.defis }}\" as=\"df\" hint-placeholder-count=\"2\">\n                <div style=\"font-size:12.5px;line-height:1.5;padding-left:14px;position:relative;color:oklch(0.35 0.02 260);\"><span style=\"position:absolute;left:0;color:oklch(0.6 0.14 55);\">○<\u002Fspan> {{ df }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(0.45 0.08 220);margin:8px 0 2px;\">Pistes d'intervention <span style=\"text-transform:none;letter-spacing:0;font-weight:600;color:oklch(0.55 0.02 260);\">— cochées = incluses dans le Word<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ cat.strategies }}\" as=\"strat\" hint-placeholder-count=\"2\">\n                <label style=\"display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5;padding:3px 0;cursor:pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ strat.checked }}\" sc-camel-on-change=\"{{ strat.onToggle }}\" style=\"margin-top:3px;flex:none;accent-color:oklch(0.5 0.1 220);\">\n                  <span>{{ strat.text }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasNoPriorite }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:20px;color:oklch(0.55 0.02 260);font-size:13.5px;\">Aucun défi identifié pour l'instant — l'élève maîtrise le palier estimé sur toutes les composantes actives.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section style=\"background:white;border-radius:18px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px oklch(0 0 0 / 0.06);\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;\">\n      <h2 style=\"margin:0;font-size:16px;font-weight:700;color:oklch(0.4 0.08 220);\">Attentes ciblées par période<\u002Fh2>\n      <button sc-camel-on-click=\"{{ onAddPeriode }}\" style=\"border:none;background:oklch(0.6 0.14 55);color:white;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;\">+ Ajouter une période<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasNoPeriodes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:20px;color:oklch(0.55 0.02 260);font-size:13.5px;\">Aucune période pour l'instant — ajoute une période pour choisir les attentes à communiquer aux parents.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-for list=\"{{ periodes }}\" as=\"per\" hint-placeholder-count=\"1\">\n      <div style=\"border:1px solid oklch(0.9 0.01 260);border-radius:14px;padding:14px 16px;margin-bottom:12px;\">\n        <div style=\"display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;\">\n          <input value=\"{{ per.dates }}\" sc-camel-on-change=\"{{ per.onDatesChange }}\" placeholder=\"p. ex. Novembre à janvier\" style=\"flex:1;min-width:180px;padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;\">\n          <sc-raw-select value=\"{{ per.composanteId }}\" sc-camel-on-change=\"{{ per.onComposanteChange }}\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;\">\n            <sc-for list=\"{{ per.composanteOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <option value=\"{{ opt.id }}\">{{ opt.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <button sc-camel-on-click=\"{{ per.onRemove }}\" style=\"border:none;background:none;color:oklch(0.6 0.02 260);cursor:pointer;font-size:13px;\">Retirer la période ✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:700;color:oklch(0.55 0.02 260);margin-bottom:6px;\">Attentes du prochain palier pour cette composante<\u002Fdiv>\n        <sc-if value=\"{{ per.hasItems }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-for list=\"{{ per.availableItems }}\" as=\"ai\" hint-placeholder-count=\"2\">\n            <label style=\"display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13.5px;cursor:pointer;\">\n              <input type=\"checkbox\" checked=\"{{ ai.checked }}\" sc-camel-on-change=\"{{ ai.onToggle }}\"> <span>{{ ai.text }}<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ per.hasNoItems }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:oklch(0.6 0.02 260);\">Aucune attente disponible pour cette composante à ce palier.<\u002Fdiv>\n        <\u002Fsc-if>\n        <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);margin-top:10px;\">Commentaires / preuves d'apprentissage\n          <textarea value=\"{{ per.commentaires }}\" sc-camel-on-change=\"{{ per.onCommentairesChange }}\" rows=\"2\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;resize:vertical;\"><\u002Ftextarea>\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStepCommunication }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"background:white;border-radius:18px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px oklch(0 0 0 / 0.06);\">\n    <h2 style=\"margin:0 0 14px;font-size:16px;font-weight:700;color:oklch(0.4 0.08 220);\">Communication du rendement<\u002Fh2>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;\">\n      <div style=\"font-size:13px;font-weight:700;color:oklch(0.45 0.02 260);\">Présentation du plan / Bulletins de progrès<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onAddBulletin }}\" style=\"border:none;background:oklch(0.5 0.1 220);color:white;border-radius:10px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;\">+ Ajouter<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-for list=\"{{ bulletins }}\" as=\"b\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;gap:8px;margin-bottom:8px;\">\n        <input value=\"{{ b.label }}\" sc-camel-on-change=\"{{ b.onLabelChange }}\" style=\"flex:1;padding:8px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;\">\n        <button sc-camel-on-click=\"{{ b.onRemove }}\" style=\"border:none;background:none;color:oklch(0.6 0.02 260);cursor:pointer;\">✕<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);margin:14px 0;\">Résumé de la rencontre\n      <textarea value=\"{{ resume }}\" sc-camel-on-change=\"{{ onResumeChange }}\" rows=\"3\" style=\"padding:10px 12px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;resize:vertical;\"><\u002Ftextarea>\n    <\u002Flabel>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Nom et prénom du parent ou tuteur\n        <input value=\"{{ parentNom }}\" sc-camel-on-change=\"{{ onParentNomChange }}\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:oklch(0.45 0.02 260);\">Date\n        <input type=\"date\" value=\"{{ parentDate }}\" sc-camel-on-change=\"{{ onParentDateChange }}\" style=\"padding:9px 11px;border-radius:10px;border:1px solid oklch(0.88 0.01 260);font-size:14px;\">\n      <\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"background:linear-gradient(135deg, oklch(0.4 0.09 220), oklch(0.48 0.1 230));border-radius:18px;padding:22px 24px;color:white;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n    <div>\n      <div style=\"font-size:15px;font-weight:800;\">Prêt à générer le PAT<\u002Fdiv>\n      <div style=\"font-size:12.5px;opacity:0.85;margin-top:2px;\">Le fichier .docx inclut l'en-tête, les forces/défis, les priorités et les attentes ciblées.<\u002Fdiv>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ onGenerate }}\" disabled=\"{{ generating }}\" style=\"border:none;background:white;color:oklch(0.4 0.09 220);border-radius:12px;padding:13px 26px;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap;\" style-hover=\"filter:brightness(0.96);\">{{ generateLabelLong }}<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;justify-content:space-between;margin-top:20px;\">\n    <sc-if value=\"{{ hasPrevStep }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ onPrevStep }}\" style=\"border:1px solid oklch(0.85 0.01 260);background:white;color:oklch(0.45 0.02 260);border-radius:12px;padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;\">← Précédent<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasNoPrevStep }}\" hint-placeholder-val=\"{{ true }}\"><span><\u002Fspan><\u002Fsc-if>\n    <div style=\"display:flex;gap:10px;\">\n      <button sc-camel-on-click=\"{{ onReset }}\" style=\"border:1px solid oklch(0.85 0.01 260);background:white;color:oklch(0.6 0.05 30);border-radius:12px;padding:11px 18px;font-weight:700;font-size:13px;cursor:pointer;\">Réinitialiser<\u002Fbutton>\n      <sc-if value=\"{{ hasNextStep }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ onNextStep }}\" style=\"border:none;background:oklch(0.45 0.1 220);color:white;border-radius:12px;padding:11px 24px;font-weight:800;font-size:14px;cursor:pointer;\" style-hover=\"filter:brightness(1.08);\">Suivant →<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PALIER_ORDER = ['eveil', 1, 2, 3, 4];\nconst STEPS = [\n  { id: 'eleve', label: 'Élève' },\n  { id: 'diagnostic', label: 'Diagnostic TPALF' },\n  { id: 'priorites', label: 'Priorités & attentes' },\n  { id: 'communication', label: 'Communication & envoi' },\n];\n\nconst ANNEES_SCOLAIRES = [\"1re année\",\"2e année\",\"3e année\",\"4e année\",\"5e année\",\"6e année\",\"7e année\",\"8e année\",\"9e année\",\"10e année\",\"11e année\",\"12e année\"];\nconst PAYS = [\"Afghanistan\",\"Afrique du Sud\",\"Albanie\",\"Algérie\",\"Allemagne\",\"Andorre\",\"Angola\",\"Antigua-et-Barbuda\",\"Arabie saoudite\",\"Argentine\",\"Arménie\",\"Australie\",\"Autriche\",\"Azerbaïdjan\",\"Bahamas\",\"Bahreïn\",\"Bangladesh\",\"Barbade\",\"Belgique\",\"Belize\",\"Bénin\",\"Bhoutan\",\"Biélorussie\",\"Birmanie (Myanmar)\",\"Bolivie\",\"Bosnie-Herzégovine\",\"Botswana\",\"Brésil\",\"Brunei\",\"Bulgarie\",\"Burkina Faso\",\"Burundi\",\"Cambodge\",\"Cameroun\",\"Canada\",\"Cap-Vert\",\"Centrafrique\",\"Chili\",\"Chine\",\"Chypre\",\"Colombie\",\"Comores\",\"Congo (Brazzaville)\",\"Congo (RDC)\",\"Corée du Nord\",\"Corée du Sud\",\"Costa Rica\",\"Côte d'Ivoire\",\"Croatie\",\"Cuba\",\"Danemark\",\"Djibouti\",\"Dominique\",\"Égypte\",\"Émirats arabes unis\",\"Équateur\",\"Érythrée\",\"Espagne\",\"Estonie\",\"Eswatini\",\"États-Unis\",\"Éthiopie\",\"Fidji\",\"Finlande\",\"France\",\"Gabon\",\"Gambie\",\"Géorgie\",\"Ghana\",\"Grèce\",\"Grenade\",\"Guatemala\",\"Guinée\",\"Guinée équatoriale\",\"Guinée-Bissau\",\"Guyana\",\"Haïti\",\"Honduras\",\"Hongrie\",\"Îles Marshall\",\"Îles Salomon\",\"Inde\",\"Indonésie\",\"Irak\",\"Iran\",\"Irlande\",\"Islande\",\"Israël\",\"Italie\",\"Jamaïque\",\"Japon\",\"Jordanie\",\"Kazakhstan\",\"Kenya\",\"Kirghizistan\",\"Kiribati\",\"Kosovo\",\"Koweït\",\"Laos\",\"Lesotho\",\"Lettonie\",\"Liban\",\"Liberia\",\"Libye\",\"Liechtenstein\",\"Lituanie\",\"Luxembourg\",\"Macédoine du Nord\",\"Madagascar\",\"Malaisie\",\"Malawi\",\"Maldives\",\"Mali\",\"Malte\",\"Maroc\",\"Maurice\",\"Mauritanie\",\"Mexique\",\"Micronésie\",\"Moldavie\",\"Monaco\",\"Mongolie\",\"Monténégro\",\"Mozambique\",\"Namibie\",\"Nauru\",\"Népal\",\"Nicaragua\",\"Niger\",\"Nigeria\",\"Norvège\",\"Nouvelle-Zélande\",\"Oman\",\"Ouganda\",\"Ouzbékistan\",\"Pakistan\",\"Palaos\",\"Palestine\",\"Panama\",\"Papouasie-Nouvelle-Guinée\",\"Paraguay\",\"Pays-Bas\",\"Pérou\",\"Philippines\",\"Pologne\",\"Portugal\",\"Qatar\",\"République dominicaine\",\"République tchèque\",\"Roumanie\",\"Royaume-Uni\",\"Russie\",\"Rwanda\",\"Saint-Christophe-et-Niévès\",\"Sainte-Lucie\",\"Saint-Marin\",\"Saint-Vincent-et-les-Grenadines\",\"Salvador\",\"Samoa\",\"Sao Tomé-et-Principe\",\"Sénégal\",\"Serbie\",\"Seychelles\",\"Sierra Leone\",\"Singapour\",\"Slovaquie\",\"Slovénie\",\"Somalie\",\"Soudan\",\"Soudan du Sud\",\"Sri Lanka\",\"Suède\",\"Suisse\",\"Suriname\",\"Syrie\",\"Tadjikistan\",\"Taïwan\",\"Tanzanie\",\"Tchad\",\"Thaïlande\",\"Timor oriental\",\"Togo\",\"Tonga\",\"Trinité-et-Tobago\",\"Tunisie\",\"Turkménistan\",\"Turquie\",\"Tuvalu\",\"Ukraine\",\"Uruguay\",\"Vanuatu\",\"Vatican\",\"Venezuela\",\"Viêt Nam\",\"Yémen\",\"Zambie\",\"Zimbabwe\",\"Autre\"];\nconst LANGUES = [\"Français\",\"Anglais\",\"Arabe\",\"Arabe (Maghreb / darija)\",\"Arabe (Levant)\",\"Arabe (Égypte)\",\"Espagnol\",\"Portugais\",\"Créole haïtien\",\"Créole antillais (Guadeloupe, Martinique)\",\"Créole guyanais\",\"Créole réunionnais\",\"Créole mauricien\",\"Créole seychellois\",\"Créole cap-verdien\",\"Créole jamaïcain (patois)\",\"Créole de Sierra Leone (krio)\",\"Pidgin nigérian\",\"Mandarin\",\"Cantonais\",\"Hakka\",\"Min (hokkien, teochew)\",\"Tibétain\",\"Ouïghour\",\"Hindi\",\"Ourdou\",\"Pendjabi\",\"Bengali\",\"Gujarati\",\"Marathi\",\"Tamoul\",\"Télougou\",\"Malayalam\",\"Kannada\",\"Cingalais\",\"Népalais\",\"Persan (farsi)\",\"Dari\",\"Pachto\",\"Tadjik\",\"Kurde (kurmandji)\",\"Kurde (sorani)\",\"Turc\",\"Azéri\",\"Ouzbek\",\"Kazakh\",\"Arménien\",\"Géorgien\",\"Hébreu\",\"Araméen / assyrien\",\"Amharique\",\"Tigrigna\",\"Oromo\",\"Somali\",\"Afar\",\"Kiswahili\",\"Kinyarwanda\",\"Kirundi\",\"Luganda\",\"Lingala\",\"Kikongo\",\"Tshiluba\",\"Swahili congolais\",\"Sango\",\"Wolof\",\"Peul (pulaar, fulfulde)\",\"Mandingue\",\"Bambara\",\"Dioula\",\"Soninké\",\"Mooré\",\"Haoussa\",\"Yoruba\",\"Igbo\",\"Twi / akan\",\"Éwé\",\"Fon\",\"Bassa\",\"Ewondo\",\"Douala\",\"Malgache\",\"Shona\",\"Zoulou\",\"Xhosa\",\"Sesotho\",\"Setswana\",\"Tamazight (berbère, kabyle)\",\"Russe\",\"Ukrainien\",\"Biélorusse\",\"Polonais\",\"Tchèque\",\"Slovaque\",\"Hongrois\",\"Roumain\",\"Moldave\",\"Bulgare\",\"Serbe\",\"Croate\",\"Bosniaque\",\"Macédonien\",\"Slovène\",\"Albanais\",\"Grec\",\"Italien\",\"Allemand\",\"Néerlandais\",\"Suédois\",\"Norvégien\",\"Danois\",\"Finnois\",\"Estonien\",\"Letton\",\"Lituanien\",\"Romani\",\"Tagalog (filipino)\",\"Cebuano\",\"Ilocano\",\"Vietnamien\",\"Khmer\",\"Lao\",\"Thaï\",\"Birman\",\"Karen\",\"Malais\",\"Indonésien\",\"Coréen\",\"Japonais\",\"Mongol\",\"Langue des signes québécoise (LSQ)\",\"American Sign Language (ASL)\",\"Cri\",\"Ojibwé\",\"Inuktitut\",\"Mohawk\",\"Innu\",\"Mi'kmaq\",\"Autre langue autochtone\",\"Autre\"];\nclass Component extends DCLogic {\n  state = {\n    step: 'eleve',\n    student: { nom: '', annee: '', dateRevision: '', paysOrigine: '', langueDominante: '' },\n    anneeTpalf: 'primaire',\n    activeComposantes: { communication_orale: true, lecture: true, ecriture: true, personnalise: false },\n    tab: 'communication_orale',\n    bank: [],\n    seeded: {},\n    sel: {},\n    addValues: {},\n    showPalierInfo: false,\n    periodes: [],\n    periodeItemSel: {},\n    bulletins: [{ id: 'b1', label: 'Bulletin 1' }, { id: 'b2', label: 'Bulletin 2' }],\n    resume: '',\n    parentNom: '',\n    parentDate: '',\n    generating: false,\n    seedVersion: 'tpalf-officiel-v2',\n  };\n\n  async componentDidMount() {\n    const res0 = window.__resources || {};\n    this.data = await import(res0.tpalfData || './tpalf-data.js');\n    this.docx = await import(res0.docxBuilder || './docx-builder.js');\n    const res = window.__resources || {};\n    const [primaire, moyen, intermediaire, secondaire, strategiesModule] = await Promise.all([\n      import(res.seedPrimaire || './tpalf-seed-primaire.js'),\n      import(res.seedMoyen || './tpalf-seed-moyen.js'),\n      import(res.seedIntermediaire || './tpalf-seed-intermediaire.js'),\n      import(res.seedSecondaire || './tpalf-seed-secondaire.js'),\n      import(res.strategies || './strategies.js'),\n    ]);\n    this.strategiesModule = strategiesModule;\n    this.seedByAnnee = {\n      primaire: primaire.SEED_PRIMAIRE,\n      moyen: moyen.SEED_MOYEN,\n      intermediaire: intermediaire.SEED_INTERMEDIAIRE,\n      secondaire: secondaire.SEED_SECONDAIRE,\n    };\n    this.synthByAnnee = {\n      primaire: primaire.SYNTHESES_PRIMAIRE, moyen: moyen.SYNTHESES_MOYEN,\n      intermediaire: intermediaire.SYNTHESES_INTERMEDIAIRE, secondaire: secondaire.SYNTHESES_SECONDAIRE,\n    };\n    let restored = null;\n    try {\n      const raw = localStorage.getItem('pat_tool_state_v3');\n      if (raw) restored = JSON.parse(raw);\n    } catch (e) {}\n    const next = restored || {};\n    if (next.bank) {\n      // Migration: strip pre-année-scoped seed ids (old format `seed-{composanteId}-...`,\n      // superseded by `seed-{anneeKey}-{composanteId}-...`) so stale entries from before\n      // multi-année seeding don't linger alongside their re-seeded replacements.\n      const OLD_PREFIXES = ['seed-communication_orale-', 'seed-lecture-', 'seed-ecriture-', 'seed-personnalise-'];\n      next.bank = next.bank.filter(b => !OLD_PREFIXES.some(pre => String(b.id).startsWith(pre)));\n      if (next.seedVersion !== 'tpalf-officiel-v2') {\n        const stale = new Set(next.bank.filter(b => String(b.id).startsWith('seed-')).map(b => b.id));\n        next.bank = next.bank.filter(b => !stale.has(b.id));\n        if (next.sel) next.sel = Object.fromEntries(Object.entries(next.sel).filter(([k]) => !stale.has(k)));\n        next.seeded = {};\n      }\n      next.seedVersion = 'tpalf-officiel-v2';\n      const seen = new Set();\n      next.bank = next.bank.filter(b => {\n        const key = `${b.annee || 'primaire'}|${b.composanteId}|${b.palierId}|${b.category}|${b.text}`;\n        if (seen.has(key)) return false;\n        seen.add(key);\n        return true;\n      });\n    }\n    this.setState(next, () => this.ensureSeed());\n  }\n\n  persist(next) {\n    this.setState(next, () => {\n      try {\n        const { seeded, generating, ...toSave } = this.state;\n        localStorage.setItem('pat_tool_state_v3', JSON.stringify(toSave));\n      } catch (e) {}\n    });\n  }\n\n  uid() { return Math.random().toString(36).slice(2, 10); }\n\n  // Idempotent by design (content-keyed dedup) rather than gated by a one-time \"seeded\"\n  // flag — self-heals any previously-persisted bank that is missing items (e.g. from an\n  // earlier dedup bug) instead of permanently skipping an \"already seeded\" année.\n  ensureSeed() {\n    if (!this.seedByAnnee || this._seedDone) return;\n    this._seedDone = true;\n    const newItems = [];\n    Object.keys(this.seedByAnnee).forEach(anneeKey => {\n      const SEED = this.seedByAnnee[anneeKey];\n      Object.keys(SEED).forEach(composanteId => {\n        Object.keys(SEED[composanteId]).forEach(palierId => {\n          const cats = SEED[composanteId][palierId];\n          Object.keys(cats).forEach(category => {\n            cats[category].forEach((text, idx) => {\n              newItems.push({ id: `seed-${anneeKey}-${composanteId}-${palierId}-${category}-${idx}`.replace(/\\s+/g, '_'), annee: anneeKey, composanteId, palierId, category, text });\n            });\n          });\n        });\n      });\n    });\n    const merged = [...this.state.bank, ...newItems];\n    const seen = new Set();\n    const deduped = merged.filter(b => {\n      const key = `${b.annee || 'primaire'}|${b.composanteId}|${b.palierId}|${b.category}|${b.text}`;\n      if (seen.has(key)) return false;\n      seen.add(key);\n      return true;\n    });\n    const allSeeded = { primaire: true, moyen: true, intermediaire: true, secondaire: true };\n    if (deduped.length !== this.state.bank.length) this.persist({ bank: deduped, seeded: allSeeded });\n    else if (!this.state.seeded.primaire || !this.state.seeded.moyen || !this.state.seeded.intermediaire || !this.state.seeded.secondaire) this.persist({ seeded: allSeeded });\n  }\n\n  stratKey(cid, cat, idx) { return `${this.state.anneeTpalf}|${cid}|${cat}|${idx}`; }\n  isStratOn(key, idx) { const v = (this.state.stratSel || {})[key]; return v === undefined ? idx < 2 : v; }\n  toggleStrat(key, idx) { this.persist({ stratSel: { ...(this.state.stratSel || {}), [key]: !this.isStratOn(key, idx) } }); }\n\n  exportProfil = () => {\n    const { seeded, generating, bank, ...rest } = this.state;\n    const data = { app: 'generateur-pat', version: 1, savedAt: new Date().toISOString(), ...rest, bankPerso: bank.filter(b => !String(b.id).startsWith('seed-')) };\n    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n    const nom = (this.state.student.nom || 'eleve').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^\\w-]+/g, '_');\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob); a.download = `PAT_${nom}_${new Date().toISOString().slice(0, 10)}.json`;\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n  };\n\n  importProfil = () => {\n    const inp = document.createElement('input');\n    inp.type = 'file'; inp.accept = '.json,application/json';\n    inp.onchange = async () => {\n      const file = inp.files && inp.files[0]; if (!file) return;\n      try {\n        const data = JSON.parse(await file.text());\n        if (data.app !== 'generateur-pat') throw new Error();\n        const { app, version, savedAt, bankPerso, ...rest } = data;\n        const seeds = this.state.bank.filter(b => String(b.id).startsWith('seed-'));\n        this.persist({ ...rest, bank: [...seeds, ...(bankPerso || [])], step: 'eleve', profilMsg: 'Profil ouvert : ' + (rest.student && rest.student.nom || file.name) });\n        setTimeout(() => this.setState({ profilMsg: '' }), 4000);\n      } catch (e) { alert(\"Ce fichier n'est pas un profil du Générateur PAT.\"); }\n    };\n    inp.click();\n  };\n\n  nouveauProfil = () => {\n    if (!confirm('Commencer un nouveau profil ? Pensez à enregistrer le profil actuel avant.')) return;\n    const seeds = this.state.bank.filter(b => String(b.id).startsWith('seed-'));\n    this.persist({ step: 'eleve', student: { nom: '', annee: '', dateRevision: '', paysOrigine: '', langueDominante: '' }, sel: {}, stratSel: {}, periodes: [], periodeItemSel: {}, resume: '', parentNom: '', parentDate: '', bank: [...seeds, ...this.state.bank.filter(b => !String(b.id).startsWith('seed-'))] });\n  };\n\n  synthOf(cid, palierId) {\n    const t = this.synthByAnnee && this.synthByAnnee[this.state.anneeTpalf];\n    return (t && t[cid] && t[cid].synthese && t[cid].synthese[String(palierId)]) || '';\n  }\n\n  fmtDate(v) {\n    if (!v) return '';\n    const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v);\n    if (!m) return v;\n    const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];\n    return `${parseInt(m[3],10)} ${mois[parseInt(m[2],10)-1]} ${m[1]}`;\n  }\n\n  han rkAllInPalier(composanteId, palierId, value) {\n    const ids = this.state.bank.filter(b => b.composanteId === composanteId && (b.annee || 'primaire') === this.state.anneeTpalf && String(b.palierId) === String(palierId)).map(b => b.id);\n    const sel = { ...this.state.sel };\n    ids.forEach(id => { sel[id] = { ...sel[id], force: value }; });\n    this.persist({ sel });\n  }\n\n  togglePalierInfo() { this.persist({ showPalierInfo: !this.state.showPalierInfo }); }\n\n  addPeriode() {\n    const activeIds = Object.keys(this.state.activeComposantes).filter(k => this.state.activeComposantes[k]);\n    this.persist({ periodes: [...this.state.periodes, { id: this.uid(), dates: '', composanteId: activeIds[0] || '', commentaires: '' }] });\n  }\n\n  updatePeriode(id, field, value) {\n    this.persist({ periodes: this.state.periodes.map(p => p.id === id ? { ...p, [field]: value } : p) });\n  }\n\n  removePeriode(id) {\n    this.persist({ periodes: this.state.periodes.filter(p => p.id !== id) });\n  }\n\n  togglePeriodeItem(periodeId, itemId) {\n    const key = `${periodeId}|${itemId}`;\n    this.persist({ periodeItemSel: { ...this.state.periodeItemSel, [key]: !this.state.periodeItemSel[key] } });\n  }\n\n  addBulletin() {\n    this.persist({ bulletins: [...this.state.bulletins, { id: this.uid(), label: `Bulletin ${this.state.bulletins.length + 1}` }] });\n  }\n\n  updateBulletin(id, value) {\n    this.persist({ bulletins: this.state.bulletins.map(b => b.id === id ? { ...b, label: value } : b) });\n  }\n\n  removeBulletin(id) {\n    this.persist({ bulletins: this.state.bulletins.filter(b => b.id !== id) });\n  }\n\n  reset() {\n    localStorage.removeItem('pat_tool_state_v3');\n    // Bug fix: ensureSeed() is guarded by this._seedDone so it only ever seeds once;\n    // without clearing that flag here, wiping `bank` on reset left it permanently\n    // empty (no descriptors, so \"Attentes ciblées\" etc. had nothing to show).\n    this._seedDone = false;\n    this.setState({\n l;\n      const img = await new Promise((resolve, reject) => {\n        const im = new Image();\n        im.onload = () => resolve(im);\n        im.onerror = reject;\n        im.src = url;\n      });\n      const size = 120;\n      const canvas = document.createElement('canvas');\n      canvas.width = size; canvas.height = size;\n      const ctx = canvas.getContext('2d');\n      const scale = Math.max(size / img.width, size / img.height);\n      const w = img.width * scale, h = img.height * scale;\n      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);\n      const base64 = canvas.toDataURL('image/png').split(',')[1];\n      const binary = atob(base64);\n      const bytes = new Uint8Array(binary.length);\n      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);\n      return bytes;\n    } catch (e) { return null; }\n  }\n\n  async generateDocx() {\n    if (!this.data || !this.docx) return;\n    const { COMPOSANTES, PALIERS } = this.data;\n    const { p, heading, table, bulletList, imageRun, footerPageNumberXml, buildDocxBlob, downloadBlob } = this.docx;\n    const s = this.state;\n    const activeIds = COMPOSANTES.filter(c => s.activeComposantes[c.id]).map(c => c.id);\n    const logoBytes = await this.fetchLogoPng();\n\n    let body = '';\n    body += table([[{ xml: p(\"Plan d'appui temporaire\", { bold: true, size: 24, color: 'FFFFFF', spacingAfter: 20 }) + p('Francisation — d\\'après les continuums langagiers du TPALF', { bold: true, size: 11, color: 'DCE8F5', spacingAfter: 0 }), shade: '2E5C88' }]], { colWidths: [10440], borders: false, zebra: false });\n    body += p('', { spacingAfter: 160 });\n    body += table([\n      ['Nom et prénom', s.student.nom || '—', \"Année d'étude\", s.student.annee || '—'],\n      ['Date de la dernière révision', this.fmtDate(s.student.dateRevision) || '—', \"Pays d'origine\", s.student.paysOrigine || '—'],\n      [\"Langue première / dominante\", s.student.langueDominante || '—', '', ''],\n    ], { c
